    <script>
      // Defensive fix for restricted environments where window.fetch might be a getter-only property.
      // This prevents some polyfills/libraries from crashing when they try to assign to it.
      (function() {
        try {
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (descriptor && !descriptor.writable && descriptor.configurable) {
            var originalFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
